name: Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  terraform-validate:
    name: Terraform Validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Init without backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  terraform-apply:
    name: Terraform Plan and Apply
    needs: terraform-validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      GITHUB_TOKEN: ${{ secrets.GH_TERRAFORM_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      TF_VAR_budget_scope: "account"
      TF_VAR_github_oidc_provider_arn: ${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}
    steps:
      - name: Main branch guard
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${AWS_ACCESS_KEY_ID}"
          test -n "${AWS_SECRET_ACCESS_KEY}"
          test -n "${AWS_REGION}"
          test -n "${GITHUB_TOKEN}"
          test -n "${TF_VAR_budget_alert_email}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Validate
        working-directory: terraform
        run: terraform validate

      - name: Plan
        working-directory: terraform
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan
