name: Deploy AWS

on:
  workflow_call:
    inputs:
      stage:
        description: "GitHub deployment environment: dev or prod"
        required: true
        type: string
      infra_ref:
        description: "Full reviewed infra commit SHA, matching this reusable workflow's ref"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: packetloss-deploy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      STAGE: ${{ inputs.stage }}
      BUILD_MODE: ${{ vars.BUILD_MODE }}
      VITE_GAME_ENV: ${{ vars.VITE_GAME_ENV }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      INFRA_REF: ${{ inputs.infra_ref }}
    steps:
      - name: Validate stage settings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INFRA_REF" =~ ^[0-9a-f]{40}$ ]]
          case "$STAGE:$GITHUB_REF:$BUILD_MODE" in
            dev:refs/heads/dev:development|prod:refs/heads/main:production) ;;
            *) echo "::error::Stage, branch, and build mode do not match."; exit 1 ;;
          esac
          case "$VITE_GAME_ENV" in
            DEFAULT|DEMO) ;;
            *) echo "::error::VITE_GAME_ENV must be DEFAULT or DEMO."; exit 1 ;;
          esac
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "::error::VITE_API_URL must be an HTTPS origin."; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build at the domain root
        run: pnpm run build --mode "$BUILD_MODE" --base /

      - name: Record deployed revision
        run: |
          printf '{"sha":"%s","stage":"%s"}\n' "$GITHUB_SHA" "$STAGE" > dist/deployment.json

      - name: Package API Lambda
        run: |
          set -euo pipefail
          pnpm run build:backend
          cd backend-dist
          zip -qr ../packetloss-api.zip .

      - name: Checkout reviewed PACKETLOSS deployment tools
        uses: actions/checkout@v4
        with:
          repository: Haki-Malai/infra
          ref: ${{ inputs.infra_ref }}
          path: packetloss-infra
          persist-credentials: false

      - name: Build Node deployment tools
        working-directory: packetloss-infra/packetloss
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: tooling-${{ inputs.stage }}-${{ github.sha }}
          path: packetloss-infra/packetloss/dist/cloud.mjs
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ inputs.stage }}-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: api-${{ inputs.stage }}-${{ github.sha }}
          path: packetloss-api.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.stage }}
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
      GAME_CONTROL_LAMBDA_FUNCTION: ${{ vars.GAME_CONTROL_LAMBDA_FUNCTION }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Skip a superseded revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::A newer commit exists; skipping deployment of $GITHUB_SHA."
          fi

      - name: Validate deployment settings
        if: steps.revision.outputs.current == 'true'
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$AWS_ROLE_ARN"
          test -n "$S3_BUCKET"
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"
          test -n "$LAMBDA_FUNCTION_NAME"

      - uses: actions/download-artifact@v4
        if: steps.revision.outputs.current == 'true'
        with:
          name: site-${{ inputs.stage }}-${{ github.sha }}
          path: dist

      - uses: actions/download-artifact@v4
        if: steps.revision.outputs.current == 'true'
        with:
          name: api-${{ inputs.stage }}-${{ github.sha }}

      - uses: actions/download-artifact@v4
        if: steps.revision.outputs.current == 'true'
        with:
          name: tooling-${{ inputs.stage }}-${{ github.sha }}
          path: tooling

      - name: Authenticate to the stage role
        if: steps.revision.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: packetloss-${{ inputs.stage }}-${{ github.run_id }}

      - name: Publish API Lambda
        if: steps.revision.outputs.current == 'true'
        run: |
          set -euo pipefail
          test -s packetloss-api.zip
          node tooling/cloud.mjs lambda-deploy "$LAMBDA_FUNCTION_NAME" packetloss-api.zip account.handler

      - name: Publish multiplayer control Lambda when provisioned
        if: steps.revision.outputs.current == 'true' && env.GAME_CONTROL_LAMBDA_FUNCTION != ''
        run: |
          set -euo pipefail
          node tooling/cloud.mjs lambda-deploy "$GAME_CONTROL_LAMBDA_FUNCTION" packetloss-api.zip multiplayer.handler

      - name: Upload assets, then publish the entry point
        if: steps.revision.outputs.current == 'true'
        run: |
          set -euo pipefail
          test -s dist/index.html
          # Keep earlier hashed bundles available to already-open browser sessions.
          node tooling/cloud.mjs site-publish "$S3_BUCKET" dist "$CLOUDFRONT_DISTRIBUTION_ID"
