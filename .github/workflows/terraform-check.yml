name: Terraform Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/workflows/deploy-*.yml"
      - "scripts/**"
      - "tests/**"
      - "packetloss/**"

permissions:
  contents: read

jobs:
  terraform-check:
    name: Terraform Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build PACKETLOSS infrastructure runtimes
        working-directory: packetloss
        run: npm ci && npm run build

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init without backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Check operational scripts
        working-directory: .
        run: |
          bash -n scripts/game-server terraform/modules/game-server/*.sh terraform/modules/game-server/*.sh.tftpl
          npm --prefix packetloss test
